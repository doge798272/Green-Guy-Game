<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pixel wanderer · shadow realms</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #1e3a2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }

        .game-wrapper {
            background: #2a4a2e;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 12px 0 #0f1f12, 0 16px 20px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            width: 600px;
            height: 600px;
            border-radius: 12px;
            box-shadow: inset 0 0 0 2px #6b8f6b, 0 8px 0 #0d1e0d;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            background: #3e6b3e;
        }

        .controls {
            margin-top: 18px;
            display: flex;
            justify-content: center;
            gap: 18px;
            color: #b8e0b8;
            text-shadow: 2px 2px 0 #0a1a0a;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
            flex-wrap: wrap;
        }

        .controls kbd {
            background: #1f3a1f;
            padding: 6px 12px;
            border-radius: 8px;
            border-bottom: 4px solid #0f220f;
            color: #d0f0c0;
            font-size: 1.2rem;
        }

        .key-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div class="controls">
        <span class="key-group">
            <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move
        </span>
        <span class="key-group"><kbd>SPACE</kbd> sword</span>
        <span class="key-group"><kbd>SHIFT</kbd> dodge</span>
        <span class="key-group"><kbd>E</kbd> interact</span>
    </div>
</div>

<script>
    (function() {
        // ---------- CANVAS ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        // ---------- WORLD ----------
        const TILE_SIZE = 40;
        const COLS = 15;
        const ROWS = 15;
        const WORLD_WIDTH = COLS * TILE_SIZE;
        const WORLD_HEIGHT = ROWS * TILE_SIZE;

        // ---------- GAME STATE ----------
        const STATE = {
            OUTSIDE: 'outside',
            INSIDE: 'inside',
        };
        let gameState = STATE.OUTSIDE;

        // ---------- AREAS ----------
        const AREAS = {
            MEADOW: {
                name: 'Verdant Meadow',
                groundColors: ['#4a804a', '#548e54', '#3f723f'],
                accentColor: '#6aa86a',
                flowerColor: '#f0e68c',
                rockColor: '#8a9a8a',
                shadows: [
                    { type: 'shadow', x: 11 * TILE_SIZE, y: 2 * TILE_SIZE, health: 80, speed: 0.98, size: 32 },
                ],
                portals: [
                    { x: 1 * TILE_SIZE, y: 1 * TILE_SIZE, w: 40, h: 40, target: 'CAVERN', label: 'Cavern' },
                ],
                corridors: [],
            },
            CAVERN: {
                name: 'Gloom Cavern',
                groundColors: ['#2a2a3a', '#323248', '#232334'],
                accentColor: '#4a4a6a',
                flowerColor: '#6a6a8a',
                rockColor: '#5a5a7a',
                shadows: [
                    { type: 'swift', x: 5 * TILE_SIZE, y: 5 * TILE_SIZE, health: 50, speed: 1.68, size: 26 },
                    { type: 'brute', x: 10 * TILE_SIZE, y: 9 * TILE_SIZE, health: 140, speed: 0.63, size: 40 },
                ],
                portals: [
                    { x: 1 * TILE_SIZE, y: 12 * TILE_SIZE, w: 40, h: 40, target: 'MEADOW', label: 'Meadow' },
                ],
                corridors: [
                    { x: 12 * TILE_SIZE, y: 1 * TILE_SIZE, w: 40, h: 80, target: 'ABYSS', label: 'Abyss' },
                ],
            },
            ABYSS: {
                name: 'The Abyss',
                groundColors: ['#1a0a1a', '#2a0a2a', '#150515'],
                accentColor: '#4a1a4a',
                flowerColor: '#8a3a8a',
                rockColor: '#5a2a5a',
                shadows: [
                    { type: 'caster', x: 4 * TILE_SIZE, y: 4 * TILE_SIZE, health: 70, speed: 0.7, size: 30 },
                    { type: 'caster', x: 10 * TILE_SIZE, y: 6 * TILE_SIZE, health: 70, speed: 0.7, size: 30 },
                    { type: 'brute', x: 7 * TILE_SIZE, y: 11 * TILE_SIZE, health: 200, speed: 0.49, size: 44 },
                ],
                portals: [
                    { x: 1 * TILE_SIZE, y: 12 * TILE_SIZE, w: 40, h: 40, target: 'CAVERN', label: 'Cavern' },
                ],
                corridors: [
                    { x: 12 * TILE_SIZE, y: 12 * TILE_SIZE, w: 40, h: 80, target: 'BOSS', label: 'Boss Corridor' },
                ],
            },
            BOSS: {
                name: 'Sky Nest',
                groundColors: ['#2a3a2a', '#324a32', '#1e2e1e'],
                accentColor: '#5a8a5a',
                flowerColor: '#b0f0b0',
                rockColor: '#6a9a6a',
                shadows: [
                    { type: 'birdboss', x: 7 * TILE_SIZE, y: 4 * TILE_SIZE, health: 400, speed: 0.85, size: 60 },
                ],
                portals: [],
                corridors: [
                    { x: 7 * TILE_SIZE, y: 13 * TILE_SIZE, w: 80, h: 40, target: 'ABYSS', label: 'Abyss' },
                ],
            },
        };

        let currentAreaKey = 'MEADOW';
        let currentArea = AREAS[currentAreaKey];

        // ---------- PLAYER ----------
        const PLAYER_SIZE = 30;
        let player = {
            x: 3 * TILE_SIZE + (TILE_SIZE - PLAYER_SIZE) / 2,
            y: 11 * TILE_SIZE + (TILE_SIZE - PLAYER_SIZE) / 2,
            speed: 3.2 * 0.7,
            facing: 'down',
            health: 100,
            maxHealth: 100,
            hurtTimer: 0,
            walkPhase: 0,
            isMoving: false,
            gold: 50,
            isDodging: false,
            dodgeTimer: 0,
            dodgeCooldown: 0,
            dodgeDirX: 0,
            dodgeDirY: 0,
            dodgeInvuln: false,
            isMacho: false,
        };

        const DODGE_DURATION = 0.16;
        const DODGE_COOLDOWN = 0.85;
        const DODGE_SPEED = 16;

        let droppedItem = null;

        // ---------- SHADOW MONSTERS ----------
        let monsters = [];

        function spawnMonstersForArea(areaKey) {
            const area = AREAS[areaKey];
            monsters = area.shadows.map((s) => {
                const m = {
                    type: s.type,
                    x: s.x,
                    y: s.y,
                    homeX: s.x,
                    homeY: s.y,
                    width: s.size,
                    height: s.size,
                    speed: s.speed,
                    facing: 'down',
                    health: s.health,
                    maxHealth: s.health,
                    attackTimer: 0,
                    attackCooldown: 0,
                    hurtTimer: 0,
                    alive: true,
                    wanderAngle: Math.random() * Math.PI * 2,
                    wanderTimer: 0,
                    state: 'wander',
                    bobPhase: Math.random() * 10,
                    projectiles: [],
                    chargeTimer: 0,
                    isCharging: false,
                    isBoss: s.type === 'birdboss',
                };
                if (s.type === 'birdboss') {
                    // Slower cooldowns
                    m.jumpTimer = 2.6;           // was 1.8 — slower
                    m.isJumping = false;
                    m.jumpProgress = 0;
                    m.jumpFromX = 0;
                    m.jumpFromY = 0;
                    m.jumpToX = 0;
                    m.jumpToY = 0;
                    m.jumpDuration = 0.6;
                    m.jumpHeight = 80;
                    m.slamShockwaves = [];
                    m.jumpCount = 0;
                    m.flapPhase = 0;
                    m.featherTimer = 4.5;        // was 3.0 — slower
                    m.eyeBeamTimer = 11.0;       // was 8.0 — slower
                    m.isChargingBeam = false;
                    m.beamChargeProgress = 0;
                    m.beamChargeDuration = 1.4;
                    m.isFiringBeam = false;
                    m.beamFireProgress = 0;
                    m.beamFireDuration = 2.5;
                    m.beamAngle = 0;
                    m.beamTickTimer = 0;
                }
                return m;
            });
            droppedItem = null;
        }

        spawnMonstersForArea(currentAreaKey);

        let portalCooldown = 0;

        // ---------- SHOP ----------
        const SHOP = {
            x: 10 * TILE_SIZE + 20,
            y: 11 * TILE_SIZE + 10,
            width: 110,
            height: 80,
        };

        const SHOP_DOOR = {
            x: SHOP.x + SHOP.width / 2 - 20,
            y: SHOP.y + SHOP.height - 10,
            width: 40,
            height: 30,
        };

        const SHOPKEEPER = {
            x: 260,
            y: 200,
            width: 40,
            height: 50,
        };

        let shopMenuOpen = false;
        let shopMessage = '';
        let shopMessageTimer = 0;

        // ---------- PLAYER ATTACK ----------
        const ATTACK_DURATION = 220;
        const ATTACK_COOLDOWN = 350;
        let attackTimer = 0;
        let attackCooldownTimer = 0;
        const SWORD_RANGE = 48;
        const SWORD_WIDTH = 22;
        let swordHitRegistered = false;

        // ---------- MONSTER ATTACK CONSTANTS ----------
        const MELEE_ATTACK_RANGE = 42;
        const MELEE_ATTACK_DAMAGE = 12;
        const MELEE_WINDUP = 380;
        const MELEE_DURATION = 200;
        const MELEE_COOLDOWN = 1100;

        // ---------- PARTICLES ----------
        let slashParticles = [];
        let hitParticles = [];
        let damageNumbers = [];

        // ---------- KEYS ----------
        const keys = {
            KeyW: false, KeyA: false, KeyS: false, KeyD: false,
            Space: false, KeyE: false, ShiftLeft: false, ShiftRight: false,
        };

        const MIN_X = 0;
        const MAX_X = WORLD_WIDTH - PLAYER_SIZE;
        const MIN_Y = 0;
        const MAX_Y = WORLD_HEIGHT - PLAYER_SIZE;

        // ---------- KEYBOARD ----------
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!keys.Space) tryAttack();
                keys.Space = true;
            } else if (e.code === 'KeyE') {
                e.preventDefault();
                if (!keys.KeyE) tryInteract();
                keys.KeyE = true;
            } else if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                e.preventDefault();
                if (!keys[e.code]) tryDodge();
                keys[e.code] = true;
            } else if (e.code in keys) {
                e.preventDefault();
                keys[e.code] = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code in keys) {
                e.preventDefault();
                keys[e.code] = false;
            }
        });

        window.addEventListener('keydown', (e) => {
            if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'KeyE', 'ShiftLeft', 'ShiftRight'].includes(e.code)) {
                e.preventDefault();
            }
        }, { passive: false });

        // ---------- AREA TRANSITION ----------
        function changeArea(targetKey) {
            if (portalCooldown > 0) return;
            currentAreaKey = targetKey;
            currentArea = AREAS[targetKey];
            spawnMonstersForArea(targetKey);
            portalCooldown = 1.0;

            player.x = 1.5 * TILE_SIZE;
            player.y = 12 * TILE_SIZE;
            player.hurtTimer = 0;
            player.isDodging = false;
            player.dodgeInvuln = false;

            slashParticles.length = 0;
            hitParticles.length = 0;
            damageNumbers.length = 0;
            attackTimer = 0;
            attackCooldownTimer = 0;
        }

        // ---------- INTERACT ----------
        function tryInteract() {
            if (gameState === STATE.OUTSIDE) {
                for (const p of currentArea.portals) {
                    const px = player.x + PLAYER_SIZE / 2;
                    const py = player.y + PLAYER_SIZE / 2;
                    if (px > p.x && px < p.x + p.w && py > p.y && py < p.y + p.h) {
                        changeArea(p.target);
                        return;
                    }
                }
                for (const c of currentArea.corridors) {
                    const px = player.x + PLAYER_SIZE / 2;
                    const py = player.y + PLAYER_SIZE / 2;
                    if (px > c.x && px < c.x + c.w && py > c.y && py < c.y + c.h) {
                        changeArea(c.target);
                        return;
                    }
                }

                if (currentAreaKey === 'MEADOW') {
                    const px = player.x + PLAYER_SIZE / 2;
                    const py = player.y + PLAYER_SIZE / 2;
                    if (px > SHOP_DOOR.x && px < SHOP_DOOR.x + SHOP_DOOR.width &&
                        py > SHOP_DOOR.y && py < SHOP_DOOR.y + SHOP_DOOR.height) {
                        gameState = STATE.INSIDE;
                        shopMenuOpen = true;
                        shopMessage = 'Welcome to my shop!';
                        shopMessageTimer = 2000;
                    }
                }
            } else if (gameState === STATE.INSIDE) {
                gameState = STATE.OUTSIDE;
                shopMenuOpen = false;
                player.x = SHOP_DOOR.x + 5;
                player.y = SHOP_DOOR.y + 40;
            }
        }

        // ---------- DODGE ----------
        function tryDodge() {
            if (gameState !== STATE.OUTSIDE) return;
            if (player.dodgeCooldown > 0) return;
            if (player.isDodging) return;

            let ddx = 0, ddy = 0;
            if (keys.KeyA) ddx -= 1;
            if (keys.KeyD) ddx += 1;
            if (keys.KeyW) ddy -= 1;
            if (keys.KeyS) ddy += 1;

            if (ddx === 0 && ddy === 0) {
                const facingAngles = { 'down': [0, 1], 'up': [0, -1], 'left': [-1, 0], 'right': [1, 0] };
                [ddx, ddy] = facingAngles[player.facing];
            }

            const len = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
            player.dodgeDirX = ddx / len;
            player.dodgeDirY = ddy / len;
            player.isDodging = true;
            player.dodgeTimer = DODGE_DURATION;
            player.dodgeCooldown = DODGE_COOLDOWN;
            player.dodgeInvuln = true;

            for (let i = 0; i < 10; i++) {
                const a = Math.random() * Math.PI * 2;
                const sp = 1 + Math.random() * 3;
                hitParticles.push({
                    x: player.x + PLAYER_SIZE / 2,
                    y: player.y + PLAYER_SIZE / 2,
                    vx: Math.cos(a) * sp,
                    vy: Math.sin(a) * sp,
                    life: 0.5,
                    size: 2 + Math.random() * 3,
                    color: '#c0ffe0',
                });
            }
        }

        // ---------- ATTACK ----------
        function tryAttack() {
            if (gameState !== STATE.OUTSIDE) return;
            if (attackCooldownTimer > 0) return;
            if (attackTimer > 0) return;
            if (player.isDodging) return;

            attackTimer = ATTACK_DURATION;
            attackCooldownTimer = ATTACK_COOLDOWN;
            swordHitRegistered = false;

            const angleOffset = { 'down': 90, 'up': -90, 'left': 180, 'right': 0 }[player.facing];
            for (let i = 0; i < 5; i++) {
                const spread = (Math.random() - 0.5) * 0.9;
                slashParticles.push({
                    x: player.x + PLAYER_SIZE / 2,
                    y: player.y + PLAYER_SIZE / 2,
                    vx: Math.cos((angleOffset + spread) * Math.PI / 180) * 2.5,
                    vy: Math.sin((angleOffset + spread) * Math.PI / 180) * 2.5,
                    life: 1.0,
                    size: 2 + Math.random() * 3,
                });
            }
        }

        // ---------- HITBOXES ----------
        function getSwordHitbox() {
            const cx = player.x + PLAYER_SIZE / 2;
            const cy = player.y + PLAYER_SIZE / 2;
            const facingAngles = { 'down': 90, 'up': -90, 'left': 180, 'right': 0 };
            const rad = (facingAngles[player.facing] || 0) * Math.PI / 180;
            const hitX = cx + Math.cos(rad) * SWORD_RANGE;
            const hitY = cy + Math.sin(rad) * SWORD_RANGE;
            return { x: hitX - SWORD_WIDTH / 2, y: hitY - SWORD_WIDTH / 2, w: SWORD_WIDTH, h: SWORD_WIDTH };
        }

        function getMonsterHitbox(m) {
            return { x: m.x + 4, y: m.y + 4, w: m.width - 8, h: m.height - 8 };
        }

        function rectsOverlap(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function pointToSegmentDist(px, py, x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const lenSq = dx * dx + dy * dy;
            if (lenSq === 0) return Math.sqrt((px - x1) ** 2 + (py - y1) ** 2);
            let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
            t = Math.max(0, Math.min(1, t));
            const projX = x1 + t * dx;
            const projY = y1 + t * dy;
            return Math.sqrt((px - projX) ** 2 + (py - projY) ** 2);
        }

        // ---------- DAMAGE PLAYER ----------
        function damagePlayer(amount, sourceX, sourceY, color) {
            if (player.hurtTimer > 0) return false;
            if (player.dodgeInvuln) {
                spawnDamageNumber(player.x + PLAYER_SIZE / 2, player.y - 6, 'DODGE!', '#c0ffe0');
                return false;
            }
            player.health -= amount;
            player.hurtTimer = 450;
            spawnDamageNumber(player.x + PLAYER_SIZE / 2, player.y, '-' + amount, color || '#ff6060');
            spawnHitParticles(sourceX || player.x + PLAYER_SIZE / 2, sourceY || player.y + PLAYER_SIZE / 2, '#ff4040', 8);
            if (player.health < 0) player.health = 0;
            return true;
        }

        // ---------- FX ----------
        function spawnHitParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1.5 + Math.random() * 3;
                hitParticles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 0.8 + Math.random() * 0.4,
                    size: 2 + Math.random() * 4,
                    color,
                });
            }
        }

        function spawnDamageNumber(x, y, text, color) {
            damageNumbers.push({ x, y, text, color, life: 1.0, vy: -0.7 });
        }

        // ---------- MONSTER UPDATE ----------
        function updateMonsters(deltaTime) {
            if (gameState !== STATE.OUTSIDE) return;

            for (const m of monsters) {
                if (!m.alive) continue;

                m.bobPhase += deltaTime * 5;
                if (m.hurtTimer > 0) m.hurtTimer -= deltaTime * 1000;
                if (m.attackCooldown > 0) m.attackCooldown -= deltaTime * 1000;

                for (let i = m.projectiles.length - 1; i >= 0; i--) {
                    const pr = m.projectiles[i];
                    pr.x += pr.vx * deltaTime * 60;
                    pr.y += pr.vy * deltaTime * 60;
                    pr.life -= deltaTime;

                    if (rectsOverlap(
                        { x: pr.x - pr.r, y: pr.y - pr.r, w: pr.r * 2, h: pr.r * 2 },
                        { x: player.x + 4, y: player.y + 4, w: PLAYER_SIZE - 8, h: PLAYER_SIZE - 8 }
                    )) {
                        damagePlayer(pr.damage, pr.x, pr.y, '#ff6060');
                        spawnHitParticles(pr.x, pr.y, pr.color || '#ff40a0', 6);
                        m.projectiles.splice(i, 1);
                        continue;
                    }

                    if (pr.life <= 0 || pr.x < -30 || pr.x > WORLD_WIDTH + 30 || pr.y < -30 || pr.y > WORLD_HEIGHT + 30) {
                        m.projectiles.splice(i, 1);
                    }
                }

                if (m.slamShockwaves) {
                    for (let i = m.slamShockwaves.length - 1; i >= 0; i--) {
                        const sw = m.slamShockwaves[i];
                        sw.radius += deltaTime * 260;
                        sw.life -= deltaTime;
                        const dx = (player.x + PLAYER_SIZE / 2) - sw.x;
                        const dy = (player.y + PLAYER_SIZE / 2) - sw.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (!sw.hitPlayer && Math.abs(dist - sw.radius) < 18) {
                            sw.hitPlayer = true;
                            damagePlayer(15, sw.x, sw.y, '#ff6060');
                        }
                        if (sw.life <= 0) m.slamShockwaves.splice(i, 1);
                    }
                }

                const dx = (player.x + PLAYER_SIZE / 2) - (m.x + m.width / 2);
                const dy = (player.y + PLAYER_SIZE / 2) - (m.y + m.height / 2);
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (Math.abs(dx) > Math.abs(dy)) m.facing = dx > 0 ? 'right' : 'left';
                else m.facing = dy > 0 ? 'down' : 'up';

                if (m.type === 'shadow' || m.type === 'swift' || m.type === 'brute') {
                    updateMeleeMonster(m, dx, dy, dist, deltaTime);
                } else if (m.type === 'caster') {
                    updateCasterMonster(m, dx, dy, dist, deltaTime);
                } else if (m.type === 'birdboss') {
                    updateBirdBoss(m, dx, dy, dist, deltaTime);
                }

                if (m.x < 0) m.x = 0;
                if (m.x > WORLD_WIDTH - m.width) m.x = WORLD_WIDTH - m.width;
                if (m.y < 0) m.y = 0;
                if (m.y > WORLD_HEIGHT - m.height) m.y = WORLD_HEIGHT - m.height;
            }

            // ---------- ITEM PICKUP ----------
            if (droppedItem && !droppedItem.collected) {
                droppedItem.bobPhase += deltaTime * 4;
                const px = player.x + PLAYER_SIZE / 2;
                const py = player.y + PLAYER_SIZE / 2;
                if (rectsOverlap(
                    { x: px - 15, y: py - 15, w: 30, h: 30 },
                    { x: droppedItem.x, y: droppedItem.y, w: droppedItem.width, h: droppedItem.height }
                )) {
                    droppedItem.collected = true;
                    player.isMacho = true;
                    player.maxHealth += 50;
                    player.health = Math.min(player.maxHealth, player.health + 50);
                    spawnDamageNumber(px, py - 20, 'MACHO MODE!', '#ffa030');
                    spawnHitParticles(px, py, '#ffa030', 40);
                    shopMessage = 'You feel MACHO!';
                    shopMessageTimer = 2000;
                }
            }
        }

        // ---------- MELEE MONSTER AI ----------
        function updateMeleeMonster(m, dx, dy, dist, deltaTime) {
            if (m.attackTimer > 0) {
                m.attackTimer -= deltaTime * 1000;
                if (m.attackTimer > MELEE_DURATION - 80 && m.attackTimer < MELEE_DURATION - 20) {
                    if (dist < MELEE_ATTACK_RANGE + 10) {
                        const dmg = m.type === 'brute' ? 20 : MELEE_ATTACK_DAMAGE;
                        damagePlayer(dmg, player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE / 2, '#ff6060');
                    }
                }
                if (m.attackTimer <= 0) {
                    m.attackTimer = 0;
                    m.attackCooldown = MELEE_COOLDOWN;
                    m.state = 'chase';
                    m.isCharging = false;
                }
            } else if (m.attackTimer < 0) {
                m.attackTimer -= deltaTime * 1000;
                if (m.attackTimer <= -MELEE_WINDUP) m.attackTimer = MELEE_DURATION;
            } else {
                if (m.type === 'brute' && m.chargeTimer > 0) {
                    m.chargeTimer -= deltaTime;
                    if (m.chargeTimer <= 0) {
                        m.isCharging = true;
                        m.chargeTimer = 0;
                    }
                }

                if (m.isCharging) {
                    if (m.hurtTimer <= 0) {
                        const angle = Math.atan2(dy, dx);
                        m.x += Math.cos(angle) * m.speed * 2.5;
                        m.y += Math.sin(angle) * m.speed * 2.5;
                    }
                    if (dist < 28) {
                        m.isCharging = false;
                        m.chargeTimer = 2.5;
                    }
                } else if (dist < MELEE_ATTACK_RANGE && m.attackCooldown <= 0 && player.health > 0) {
                    m.state = 'attack';
                    m.attackTimer = -MELEE_WINDUP;
                } else if (dist < 220 && player.health > 0) {
                    m.state = 'chase';
                    if (m.hurtTimer <= 0) {
                        const angle = Math.atan2(dy, dx);
                        m.x += Math.cos(angle) * m.speed;
                        m.y += Math.sin(angle) * m.speed;
                    }
                } else {
                    m.state = 'wander';
                    m.wanderTimer -= deltaTime;
                    if (m.wanderTimer <= 0) {
                        m.wanderAngle = Math.random() * Math.PI * 2;
                        m.wanderTimer = 1 + Math.random() * 2;
                    }
                    if (m.hurtTimer <= 0) {
                        m.x += Math.cos(m.wanderAngle) * m.speed * 0.4;
                        m.y += Math.sin(m.wanderAngle) * m.speed * 0.4;
                    }
                }

                if (m.type === 'brute' && !m.isCharging && m.chargeTimer <= 0 && dist < 160 && dist > 60 && m.attackCooldown <= 0) {
                    m.chargeTimer = 0.8;
                }
            }
        }

        // ---------- CASTER MONSTER AI ----------
        function updateCasterMonster(m, dx, dy, dist, deltaTime) {
            if (m.attackCooldown > 0) return;

            if (dist < 180 && dist > 60 && player.health > 0) {
                if (m.hurtTimer <= 0) {
                    const angle = Math.atan2(dy, dx);
                    m.x -= Math.cos(angle) * m.speed * 0.7;
                    m.y -= Math.sin(angle) * m.speed * 0.7;
                }
            } else if (dist < 60 && player.health > 0) {
                const angle = Math.atan2(dy, dx);
                m.x -= Math.cos(angle) * m.speed * 1.2;
                m.y -= Math.sin(angle) * m.speed * 1.2;
            } else if (dist > 220) {
                m.wanderTimer -= deltaTime;
                if (m.wanderTimer <= 0) {
                    m.wanderAngle = Math.random() * Math.PI * 2;
                    m.wanderTimer = 1 + Math.random() * 2;
                }
                if (m.hurtTimer <= 0) {
                    m.x += Math.cos(m.wanderAngle) * m.speed * 0.4;
                    m.y += Math.sin(m.wanderAngle) * m.speed * 0.4;
                }
            }

            if (dist < 260 && m.attackCooldown <= 0 && player.health > 0) {
                const angle = Math.atan2(dy, dx);
                const speed = 2.6;
                m.projectiles.push({
                    x: m.x + m.width / 2,
                    y: m.y + m.height / 2,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    r: 6,
                    life: 2.5,
                    damage: 10,
                    color: '#ff40a0',
                });
                m.attackCooldown = 1600;
                spawnHitParticles(m.x + m.width / 2, m.y + m.height / 2, '#ff40a0', 5);
            }
        }

        // ---------- BIRD BOSS AI (slower cooldowns) ----------
        function updateBirdBoss(m, dx, dy, dist, deltaTime) {
            m.flapPhase += deltaTime * 10;

            if (m.isChargingBeam) {
                m.beamChargeProgress += deltaTime / m.beamChargeDuration;
                m.beamAngle = Math.atan2(
                    (player.y + PLAYER_SIZE / 2) - (m.y + m.height / 2),
                    (player.x + PLAYER_SIZE / 2) - (m.x + m.width / 2)
                );
                if (m.beamChargeProgress >= 1) {
                    m.isChargingBeam = false;
                    m.isFiringBeam = true;
                    m.beamFireProgress = 0;
                    m.beamTickTimer = 0;
                }
                return;
            }

            if (m.isFiringBeam) {
                m.beamFireProgress += deltaTime / m.beamFireDuration;
                const targetAngle = Math.atan2(
                    (player.y + PLAYER_SIZE / 2) - (m.y + m.height / 2),
                    (player.x + PLAYER_SIZE / 2) - (m.x + m.width / 2)
                );
                let diff = targetAngle - m.beamAngle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                m.beamAngle += diff * Math.min(1, deltaTime * 1.2);

                const bx = m.x + m.width / 2;
                const by = m.y + m.height / 2;
                const beamLen = 900;
                const ex = bx + Math.cos(m.beamAngle) * beamLen;
                const ey = by + Math.sin(m.beamAngle) * beamLen;

                m.beamTickTimer -= deltaTime;
                if (m.beamTickTimer <= 0) {
                    const pd = pointToSegmentDist(
                        player.x + PLAYER_SIZE / 2,
                        player.y + PLAYER_SIZE / 2,
                        bx, by, ex, ey
                    );
                    if (pd < 16) {
                        damagePlayer(10, player.x + PLAYER_SIZE / 2, player.y + PLAYER_SIZE / 2, '#ff4040');
                    }
                    m.beamTickTimer = 0.5;
                }

                if (Math.random() < 0.7) {
                    const t = Math.random();
                    hitParticles.push({
                        x: bx + Math.cos(m.beamAngle) * beamLen * t,
                        y: by + Math.sin(m.beamAngle) * beamLen * t,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        life: 0.25,
                        size: 2 + Math.random() * 3,
                        color: '#ff6060',
                    });
                }

                if (m.beamFireProgress >= 1) {
                    m.isFiringBeam = false;
                    m.beamFireProgress = 0;
                    m.eyeBeamTimer = 11.0;
                }
                return;
            }

            if (m.isJumping) {
                m.jumpProgress += deltaTime / m.jumpDuration;
                if (m.jumpProgress >= 1) {
                    m.jumpProgress = 1;
                    m.isJumping = false;
                    m.x = m.jumpToX;
                    m.y = m.jumpToY;
                    m.jumpCount++;

                    const cx = m.x + m.width / 2;
                    const cy = m.y + m.height / 2;
                    m.slamShockwaves.push({ x: cx, y: cy, radius: 8, life: 1.0, hitPlayer: false });
                    spawnHitParticles(cx, cy, '#c0e0ff', 20);
                    m.jumpTimer = 2.6 + Math.random() * 1.0;
                } else {
                    const t = m.jumpProgress;
                    m.x = m.jumpFromX + (m.jumpToX - m.jumpFromX) * t;
                    m.y = m.jumpFromY + (m.jumpToY - m.jumpFromY) * t;
                }
                return;
            }

            m.featherTimer -= deltaTime;
            if (m.featherTimer <= 0 && player.health > 0) {
                const count = 2;
                for (let i = 0; i < count; i++) {
                    const baseAngle = Math.atan2(dy, dx);
                    const spread = (i - (count - 1) / 2) * 0.35;
                    const angle = baseAngle + spread;
                    const speed = 2.8;
                    m.projectiles.push({
                        x: m.x + m.width / 2,
                        y: m.y + m.height / 2,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        r: 5,
                        life: 2.2,
                        damage: 8,
                        color: '#a0d0ff',
                    });
                }
                spawnHitParticles(m.x + m.width / 2, m.y + m.height / 2, '#a0d0ff', 8);
                m.featherTimer = 4.5;
            }

            m.eyeBeamTimer -= deltaTime;
            if (m.eyeBeamTimer <= 0 && player.health > 0) {
                m.isChargingBeam = true;
                m.beamChargeProgress = 0;
                m.beamAngle = Math.atan2(
                    (player.y + PLAYER_SIZE / 2) - (m.y + m.height / 2),
                    (player.x + PLAYER_SIZE / 2) - (m.x + m.width / 2)
                );
                spawnHitParticles(m.x + m.width / 2, m.y + m.height / 2, '#ff4040', 10);
                return;
            }

            if (m.jumpTimer > 0) {
                m.jumpTimer -= deltaTime;
                if (player.health > 0 && m.hurtTimer <= 0) {
                    const angle = Math.atan2(dy, dx);
                    m.x += Math.cos(angle) * m.speed * 0.5;
                    m.y += Math.sin(angle) * m.speed * 0.5;
                }
                return;
            }

            if (player.health > 0) {
                let targetX, targetY;
                if (m.jumpCount % 2 === 0) {
                    targetX = player.x + (Math.random() - 0.5) * 40;
                    targetY = player.y + (Math.random() - 0.5) * 40;
                } else {
                    targetX = player.x + (Math.random() - 0.5) * 160;
                    targetY = player.y + (Math.random() - 0.5) * 160;
                }
                targetX = Math.max(20, Math.min(WORLD_WIDTH - m.width - 20, targetX));
                targetY = Math.max(20, Math.min(WORLD_HEIGHT - m.height - 20, targetY));

                m.jumpFromX = m.x;
                m.jumpFromY = m.y;
                m.jumpToX = targetX;
                m.jumpToY = targetY;
                m.jumpProgress = 0;
                m.isJumping = true;
            }
        }

        // ---------- SWORD HIT ----------
        function checkSwordHit() {
            if (attackTimer <= 0 || swordHitRegistered) return;
            const progress = 1 - (attackTimer / ATTACK_DURATION);
            if (progress < 0.15 || progress > 0.75) return;

            const swordBox = getSwordHitbox();
            for (const m of monsters) {
                if (!m.alive) continue;
                if (m.type === 'birdboss' && m.isJumping) continue;
                if (rectsOverlap(swordBox, getMonsterHitbox(m))) {
                    swordHitRegistered = true;
                    const damage = player.isMacho ? 26 : 18;
                    m.health -= damage;
                    m.hurtTimer = 250;
                    spawnDamageNumber(m.x + m.width / 2, m.y, '-' + damage, '#ffff80');
                    spawnHitParticles(m.x + m.width / 2, m.y + m.height / 2, '#a0ffa0', 10);

                    const ddx = (m.x + m.width / 2) - (player.x + PLAYER_SIZE / 2);
                    const ddy = (m.y + m.height / 2) - (player.y + PLAYER_SIZE / 2);
                    const len = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
                    if (m.type !== 'birdboss') {
                        m.x += (ddx / len) * 20;
                        m.y += (ddy / len) * 20;
                    }

                    if (m.health <= 0) {
                        m.health = 0;
                        m.alive = false;
                        spawnHitParticles(m.x + m.width / 2, m.y + m.height / 2, '#8040ff', 30);
                        if (m.type === 'birdboss') {
                            for (let i = 0; i < 80; i++) {
                                const a = Math.random() * Math.PI * 2;
                                const sp = 2 + Math.random() * 6;
                                hitParticles.push({
                                    x: m.x + m.width / 2, y: m.y + m.height / 2,
                                    vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                                    life: 1.2 + Math.random() * 1.0,
                                    size: 3 + Math.random() * 6,
                                    color: ['#ffa030', '#ffd060', '#ff6030', '#ffffff'][Math.floor(Math.random()*4)],
                                });
                            }
                            droppedItem = {
                                x: m.x + m.width / 2 - 14,
                                y: m.y + m.height / 2 - 14,
                                width: 28,
                                height: 28,
                                bobPhase: 0,
                                collected: false,
                            };
                        }
                    }
                    break;
                }
            }
        }

        // ---------- DRAW SWORD ----------
        function drawSword() {
            if (gameState !== STATE.OUTSIDE) return;

            const cx = player.x + PLAYER_SIZE / 2;
            const cy = player.y + PLAYER_SIZE / 2;

            let angle = 0;
            const facingAngles = { 'down': 90, 'up': -90, 'left': 180, 'right': 0 };
            const baseAngle = facingAngles[player.facing] || 0;

            if (attackTimer > 0) {
                const progress = 1 - (attackTimer / ATTACK_DURATION);
                const swingOffset = Math.sin(progress * Math.PI) * 70 - 35;
                angle = baseAngle + swingOffset;
            } else {
                angle = baseAngle;
            }

            const rad = angle * Math.PI / 180;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rad);

            const bladeGrad = ctx.createLinearGradient(10, -3, 30, 3);
            bladeGrad.addColorStop(0, '#b0c4d8');
            bladeGrad.addColorStop(0.5, '#f0f8ff');
            bladeGrad.addColorStop(1, '#c0d0e0');
            ctx.fillStyle = bladeGrad;
            ctx.shadowColor = player.isMacho ? '#ffa030' : '#a0c0e0';
            ctx.shadowBlur = player.isMacho ? 10 : 6;
            ctx.fillRect(10, -3, player.isMacho ? 24 : 20, player.isMacho ? 8 : 6);
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(12, -1, 16, 2);
            ctx.fillStyle = '#8a9eb0';
            ctx.fillRect(14, 0, 12, 1);

            ctx.fillStyle = '#6a3a1a';
            ctx.fillRect(2, -4, 10, 8);
            ctx.fillStyle = '#8a5a2a';
            ctx.fillRect(3, -3, 8, 6);

            ctx.fillStyle = '#d4af37';
            ctx.fillRect(0, -3, 4, 6);
            ctx.fillStyle = '#f0d060';
            ctx.fillRect(1, -2, 2, 4);

            ctx.fillStyle = '#c9a84c';
            ctx.fillRect(8, -5, 3, 10);

            ctx.restore();

            if (attackTimer > 0) {
                const progress = 1 - (attackTimer / ATTACK_DURATION);
                const arcRadius = 40;
                const arcAngleStart = (baseAngle - 55) * Math.PI / 180;
                const arcAngleEnd = (baseAngle + 55) * Math.PI / 180;

                ctx.save();
                ctx.beginPath();
                const alpha = 0.5 * (1 - progress) + 0.1;
                ctx.strokeStyle = player.isMacho ? `rgba(255, 200, 100, ${alpha})` : `rgba(240, 255, 240, ${alpha})`;
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                const currentAngle = arcAngleStart + (arcAngleEnd - arcAngleStart) * progress;
                ctx.arc(cx, cy, arcRadius, arcAngleStart, currentAngle);
                ctx.stroke();
                ctx.strokeStyle = player.isMacho ? `rgba(255, 150, 50, ${alpha * 0.6})` : `rgba(200, 255, 200, ${alpha * 0.6})`;
                ctx.lineWidth = 14;
                ctx.arc(cx, cy, arcRadius, arcAngleStart, currentAngle);
                ctx.stroke();
                ctx.restore();
            }
        }

        // ---------- DRAW PLAYER ----------
        function drawPlayer(x, y) {
            const outline = '#0a1f0a';
            const midGreen = player.isMacho ? '#2e5a1e' : '#2e7a2e';
            const bodyGreen = player.isMacho ? '#3f8f2f' : '#3fa63f';
            const lightGreen = player.isMacho ? '#6fd06f' : '#7ee07e';
            const highlight = player.isMacho ? '#c0ffb0' : '#b0f0b0';
            const eyeWhite = '#f8f8f0';
            const pupil = '#101010';
            const beltBrown = '#7a4a2a';
            const bootBrown = '#4a2a1a';

            const hurtFlash = player.hurtTimer > 0 && Math.floor(player.hurtTimer / 60) % 2 === 0;
            if (hurtFlash) ctx.globalAlpha = 0.55;

            const dodging = player.isDodging;
            if (dodging) {
                ctx.globalAlpha *= 0.5;
            }

            const walk = player.walkPhase;
            const legSwing = player.isMoving ? Math.sin(walk) * 3 : 0;
            const armSwing = player.isMoving ? Math.sin(walk) * 2 : 0;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.beginPath();
            ctx.ellipse(x + PLAYER_SIZE / 2, y + PLAYER_SIZE - 2, 12, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = outline;
            ctx.fillRect(x + 7, y + 24, 6, 6 + legSwing);
            ctx.fillRect(x + 17, y + 24, 6, 6 - legSwing);
            ctx.fillStyle = bootBrown;
            ctx.fillRect(x + 6, y + 28 + legSwing, 8, 4);
            ctx.fillRect(x + 16, y + 28 - legSwing, 8, 4);
            ctx.fillStyle = '#6a4a2a';
            ctx.fillRect(x + 7, y + 28 + legSwing, 3, 2);
            ctx.fillRect(x + 17, y + 28 - legSwing, 3, 2);

            ctx.fillStyle = outline;
            if (player.isMacho) {
                ctx.fillRect(x + 2, y + 6, 26, 20);
                ctx.fillStyle = bodyGreen;
                ctx.fillRect(x + 3, y + 7, 24, 18);
                ctx.fillStyle = midGreen;
                ctx.fillRect(x + 3, y + 17, 24, 8);
                ctx.fillStyle = lightGreen;
                ctx.fillRect(x + 3, y + 7, 24, 4);
                ctx.fillStyle = midGreen;
                ctx.beginPath();
                ctx.ellipse(x + 10, y + 13, 6, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(x + 20, y + 13, 6, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = highlight;
                ctx.fillRect(x + 13, y + 17, 4, 1);
                ctx.fillRect(x + 13, y + 20, 4, 1);
                ctx.fillRect(x + 14, y + 17, 1, 5);
                ctx.fillRect(x + 16, y + 17, 1, 5);
            } else {
                ctx.fillRect(x + 5, y + 8, 22, 18);
                ctx.fillStyle = bodyGreen;
                ctx.fillRect(x + 6, y + 9, 20, 16);
                ctx.fillStyle = midGreen;
                ctx.fillRect(x + 6, y + 19, 20, 6);
                ctx.fillStyle = lightGreen;
                ctx.fillRect(x + 6, y + 9, 20, 4);
                ctx.fillStyle = highlight;
                ctx.fillRect(x + 14, y + 9, 4, 3);
            }

            ctx.fillStyle = beltBrown;
            ctx.fillRect(x + 6, y + 21, 20, 3);
            ctx.fillStyle = '#c9a84c';
            ctx.fillRect(x + 13, y + 21, 6, 3);
            ctx.fillStyle = '#f0d060';
            ctx.fillRect(x + 15, y + 22, 2, 1);

            if (player.isMacho) {
                ctx.fillStyle = outline;
                ctx.fillRect(x - 4, y + 9 + armSwing, 8, 12);
                ctx.fillRect(x + 26, y + 9 - armSwing, 8, 12);
                ctx.fillStyle = midGreen;
                ctx.fillRect(x - 3, y + 10 + armSwing, 6, 10);
                ctx.fillRect(x + 27, y + 10 - armSwing, 6, 10);
                ctx.fillStyle = lightGreen;
                ctx.fillRect(x - 2, y + 11 + armSwing, 4, 4);
                ctx.fillRect(x + 28, y + 11 - armSwing, 4, 4);
                ctx.fillStyle = bodyGreen;
                ctx.fillRect(x - 4, y + 19 + armSwing, 8, 5);
                ctx.fillRect(x + 26, y + 19 - armSwing, 8, 5);
            } else {
                ctx.fillStyle = outline;
                ctx.fillRect(x + 0, y + 11 + armSwing, 6, 10);
                ctx.fillRect(x + 26, y + 11 - armSwing, 6, 10);
                ctx.fillStyle = midGreen;
                ctx.fillRect(x + 1, y + 12 + armSwing, 4, 8);
                ctx.fillRect(x + 27, y + 12 - armSwing, 4, 8);
                ctx.fillStyle = lightGreen;
                ctx.fillRect(x + 1, y + 18 + armSwing, 4, 3);
                ctx.fillRect(x + 27, y + 18 - armSwing, 4, 3);
            }

            ctx.fillStyle = outline;
            ctx.fillRect(x + 6, y - 1, 20, 12);
            ctx.fillStyle = bodyGreen;
            ctx.fillRect(x + 7, y, 18, 10);
            ctx.fillStyle = lightGreen;
            ctx.fillRect(x + 7, y, 18, 4);
            ctx.fillStyle = midGreen;
            ctx.fillRect(x + 7, y + 7, 18, 3);

            ctx.fillStyle = outline;
            ctx.fillRect(x + 3, y + 2, 5, 7);
            ctx.fillRect(x + 24, y + 2, 5, 7);
            ctx.fillStyle = midGreen;
            ctx.fillRect(x + 4, y + 3, 3, 5);
            ctx.fillRect(x + 25, y + 3, 3, 5);
            ctx.fillStyle = lightGreen;
            ctx.fillRect(x + 4, y + 3, 2, 2);
            ctx.fillRect(x + 25, y + 3, 2, 2);

            ctx.fillStyle = beltBrown;
            ctx.fillRect(x + 6, y + 2, 20, 2);
            ctx.fillStyle = '#c9a84c';
            ctx.fillRect(x + 14, y + 1, 4, 4);

            if (player.facing === 'down' || player.facing === 'left' || player.facing === 'right') {
                if (player.facing === 'down') {
                    ctx.fillStyle = eyeWhite;
                    ctx.fillRect(x + 9, y + 4, 5, 5);
                    ctx.fillRect(x + 17, y + 4, 5, 5);
                    ctx.fillStyle = pupil;
                    ctx.fillRect(x + 11, y + 6, 2, 3);
                    ctx.fillRect(x + 19, y + 6, 2, 3);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(x + 10, y + 4, 2, 1);
                    ctx.fillRect(x + 18, y + 4, 2, 1);
                    ctx.fillStyle = outline;
                    if (player.isMacho) {
                        ctx.fillRect(x + 12, y + 9, 6, 1);
                        ctx.fillRect(x + 13, y + 10, 4, 1);
                    } else {
                        ctx.fillRect(x + 13, y + 9, 4, 1);
                    }
                } else if (player.facing === 'left') {
                    ctx.fillStyle = eyeWhite;
                    ctx.fillRect(x + 7, y + 4, 5, 5);
                    ctx.fillRect(x + 15, y + 4, 5, 5);
                    ctx.fillStyle = pupil;
                    ctx.fillRect(x + 7, y + 6, 2, 3);
                    ctx.fillRect(x + 15, y + 6, 2, 3);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(x + 7, y + 4, 2, 1);
                    ctx.fillRect(x + 15, y + 4, 2, 1);
                } else if (player.facing === 'right') {
                    ctx.fillStyle = eyeWhite;
                    ctx.fillRect(x + 12, y + 4, 5, 5);
                    ctx.fillRect(x + 20, y + 4, 5, 5);
                    ctx.fillStyle = pupil;
                    ctx.fillRect(x + 14, y + 6, 2, 3);
                    ctx.fillRect(x + 22, y + 6, 2, 3);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(x + 13, y + 4, 2, 1);
                    ctx.fillRect(x + 21, y + 4, 2, 1);
                }
            } else {
                ctx.fillStyle = midGreen;
                ctx.fillRect(x + 10, y + 4, 12, 4);
                ctx.fillStyle = lightGreen;
                ctx.fillRect(x + 14, y + 4, 4, 3);
            }

            if (player.isMacho) {
                const auraPulse = 0.3 + Math.sin(performance.now() / 200) * 0.15;
                ctx.strokeStyle = `rgba(255, 160, 48, ${auraPulse})`;
                ctx.lineWidth = 2;
                ctx.strokeRect(x - 3, y - 3, PLAYER_SIZE + 6, PLAYER_SIZE + 6);
            }

            if (dodging) {
                ctx.globalAlpha = 0.9;
                ctx.strokeStyle = '#c0ffe0';
                ctx.lineWidth = 2;
                ctx.strokeRect(x - 2, y - 2, PLAYER_SIZE + 4, PLAYER_SIZE + 4);
            }

            ctx.globalAlpha = 1.0;
        }

        // ---------- DRAW MONSTER ----------
        function drawMonster(m) {
            if (!m.alive || gameState !== STATE.OUTSIDE) return;

            if (m.type === 'birdboss') {
                drawBirdBoss(m);
                return;
            }

            const x = m.x;
            const y = m.y;
            const w = m.width;
            const h = m.height;
            const bob = Math.sin(m.bobPhase) * 2;

            if (m.hurtTimer > 0 && Math.floor(m.hurtTimer / 50) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            for (const pr of m.projectiles) {
                ctx.shadowColor = '#ff40a0';
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#ff60c0';
                ctx.beginPath();
                ctx.arc(pr.x, pr.y, pr.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(pr.x, pr.y, pr.r * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.shadowColor = 'transparent';
            }

            let bodyColor1, bodyColor2, eyeColor;
            if (m.type === 'shadow') {
                bodyColor1 = '#1a0a28';
                bodyColor2 = '#2d1040';
                eyeColor = '#ff3030';
            } else if (m.type === 'swift') {
                bodyColor1 = '#0a1a28';
                bodyColor2 = '#104070';
                eyeColor = '#30a0ff';
            } else if (m.type === 'brute') {
                bodyColor1 = '#281a0a';
                bodyColor2 = '#503010';
                eyeColor = '#ffa030';
            } else if (m.type === 'caster') {
                bodyColor1 = '#281a28';
                bodyColor2 = '#4a2050';
                eyeColor = '#ff40ff';
            }

            const auraGrad = ctx.createRadialGradient(
                x + w / 2, y + h / 2, 4,
                x + w / 2, y + h / 2, w
            );
            const auraColor = m.type === 'swift' ? '30, 80, 160' :
                              m.type === 'brute' ? '120, 60, 20' :
                              m.type === 'caster' ? '120, 20, 120' : '80, 0, 120';
            auraGrad.addColorStop(0, `rgba(${auraColor}, 0.6)`);
            auraGrad.addColorStop(1, `rgba(${auraColor}, 0)`);
            ctx.fillStyle = auraGrad;
            ctx.fillRect(x - 12, y - 12 + bob, w + 24, h + 24);

            ctx.fillStyle = bodyColor1;
            ctx.beginPath();
            ctx.ellipse(x + w / 2, y + h / 2 + bob, w / 2 - 2, h / 2 - 1, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = bodyColor2;
            ctx.beginPath();
            ctx.ellipse(x + w / 2, y + h / 2 - 2 + bob, w / 2 - 5, h / 2 - 5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#0d0015';
            const spikeCount = m.type === 'brute' ? 7 : 5;
            for (let i = 0; i < spikeCount; i++) {
                const angle = (i / spikeCount) * Math.PI * 2;
                const sx = x + w / 2 + Math.cos(angle) * (w / 2 - 4);
                const sy = y + h / 2 + bob + Math.sin(angle) * (h / 2 - 4) - 2;
                const spikeLen = m.type === 'brute' ? 9 : 6;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx + spikeLen, sy - spikeLen);
                ctx.lineTo(sx - spikeLen * 0.5, sy - spikeLen * 0.6);
                ctx.closePath();
                ctx.fill();
            }

            let eyeOffsetX = 0, eyeOffsetY = 0;
            if (m.facing === 'left') eyeOffsetX = -3;
            if (m.facing === 'right') eyeOffsetX = 3;
            if (m.facing === 'up') eyeOffsetY = -3;
            if (m.facing === 'down') eyeOffsetY = 2;

            const eyeSpacing = w / 6;
            ctx.shadowColor = eyeColor;
            ctx.shadowBlur = 12;
            ctx.fillStyle = eyeColor;
            ctx.beginPath();
            ctx.ellipse(x + w / 2 - eyeSpacing + eyeOffsetX, y + h / 2 - 3 + eyeOffsetY + bob, 3.5, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + w / 2 + eyeSpacing + eyeOffsetX, y + h / 2 - 3 + eyeOffsetY + bob, 3.5, 4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.ellipse(x + w / 2 - eyeSpacing + eyeOffsetX, y + h / 2 - 3 + eyeOffsetY + bob, 1.8, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + w / 2 + eyeSpacing + eyeOffsetX, y + h / 2 - 3 + eyeOffsetY + bob, 1.8, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();

            if (m.attackTimer < 0) {
                const progress = 1 - (Math.abs(m.attackTimer) / MELEE_WINDUP);
                ctx.strokeStyle = `rgba(255, 40, 40, ${progress * 0.8})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(x + w / 2, y + h / 2 + bob, w / 2 + 6, 0, Math.PI * 2);
                ctx.stroke();
            }

            if (m.attackTimer > 0) {
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(x + w / 2, y + h / 2 + bob, w / 2 + 8, 0, Math.PI * 2);
                ctx.stroke();
            }

            if (m.isCharging) {
                ctx.strokeStyle = '#ffa030';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.arc(x + w / 2, y + h / 2 + bob, w / 2 + 6, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.globalAlpha = 1.0;

            const barW = w + 8, barH = 5;
            const barX = x + w / 2 - barW / 2;
            const barY = y - 14;
            const hpRatio = Math.max(0, m.health / m.maxHealth);

            ctx.fillStyle = '#1a0a1a';
            ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
            ctx.fillStyle = '#400060';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = hpRatio > 0.5 ? '#a040ff' : (hpRatio > 0.25 ? '#ff40a0' : '#ff2020');
            ctx.fillRect(barX, barY, barW * hpRatio, barH);
        }

        // ---------- DRAW BIRD BOSS ----------
        function drawBirdBoss(m) {
            const x = m.x;
            const y = m.y;
            const w = m.width;
            const h = m.height;
            const cx = x + w / 2;

            let arcY = 0;
            if (m.isJumping) {
                const t = m.jumpProgress;
                arcY = Math.sin(t * Math.PI) * m.jumpHeight;
            }

            const shadowScale = m.isJumping ? Math.max(0.4, 1 - m.jumpProgress * 0.5) : 1;
            ctx.fillStyle = `rgba(0,0,0,${0.3 * shadowScale})`;
            ctx.beginPath();
            ctx.ellipse(cx, y + h - 4, (w / 2) * shadowScale, 8 * shadowScale, 0, 0, Math.PI * 2);
            ctx.fill();

            if (m.isJumping && m.jumpProgress > 0.3) {
                const t = m.jumpProgress;
                const indSize = 20 + t * 20;
                ctx.strokeStyle = `rgba(192, 224, 255, ${0.4 + t * 0.4})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.ellipse(m.jumpToX + w / 2, m.jumpToY + h / 2, indSize, indSize * 0.5, 0, 0, Math.PI * 2);
                ctx.stroke();
                ctx.fillStyle = `rgba(192, 224, 255, ${0.15 + t * 0.2})`;
                ctx.beginPath();
                ctx.ellipse(m.jumpToX + w / 2, m.jumpToY + h / 2, indSize, indSize * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            const drawX = x;
            const drawY = y - arcY;

            if (m.hurtTimer > 0 && Math.floor(m.hurtTimer / 50) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            const auraGrad = ctx.createRadialGradient(cx, drawY + h / 2, 6, cx, drawY + h / 2, w * 0.9);
            auraGrad.addColorStop(0, 'rgba(255, 160, 48, 0.5)');
            auraGrad.addColorStop(1, 'rgba(120, 60, 20, 0)');
            ctx.fillStyle = auraGrad;
            ctx.fillRect(drawX - 20, drawY - 20, w + 40, h + 40);

            if (m.isChargingBeam) {
                const cp = m.beamChargeProgress;
                const bx = cx;
                const by = drawY + 12;
                const orbR = 4 + cp * 14;
                const g = ctx.createRadialGradient(bx, by, 2, bx, by, orbR + 6);
                g.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
                g.addColorStop(0.4, 'rgba(255, 60, 60, 0.9)');
                g.addColorStop(1, 'rgba(255, 0, 0, 0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(bx, by, orbR + 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = `rgba(255, 60, 60, ${0.15 + cp * 0.35})`;
                ctx.lineWidth = 1 + cp * 2;
                ctx.setLineDash([8, 8]);
                ctx.beginPath();
                ctx.moveTo(bx, by);
                ctx.lineTo(bx + Math.cos(m.beamAngle) * 900, by + Math.sin(m.beamAngle) * 900);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            if (m.isFiringBeam) {
                const fp = m.beamFireProgress;
                const bx = cx;
                const by = drawY + 12;
                const beamLen = 900;
                const ex = bx + Math.cos(m.beamAngle) * beamLen;
                const ey = by + Math.sin(m.beamAngle) * beamLen;
                const beamW = 10 + Math.sin(fp * Math.PI * 6) * 2.5;

                ctx.save();
                ctx.shadowColor = '#ff2020';
                ctx.shadowBlur = 25;
                ctx.strokeStyle = 'rgba(255, 40, 40, 0.5)';
                ctx.lineWidth = beamW + 14;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(bx, by);
                ctx.lineTo(ex, ey);
                ctx.stroke();
                ctx.strokeStyle = 'rgba(255, 160, 160, 0.9)';
                ctx.lineWidth = beamW;
                ctx.beginPath();
                ctx.moveTo(bx, by);
                ctx.lineTo(ex, ey);
                ctx.stroke();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
                ctx.lineWidth = Math.max(3, beamW * 0.35);
                ctx.beginPath();
                ctx.moveTo(bx, by);
                ctx.lineTo(ex, ey);
                ctx.stroke();
                ctx.restore();

                const g = ctx.createRadialGradient(bx, by, 2, bx, by, 20);
                g.addColorStop(0, 'rgba(255, 255, 255, 1)');
                g.addColorStop(1, 'rgba(255, 40, 40, 0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(bx, by, 20, 0, Math.PI * 2);
                ctx.fill();
            }

            const flap = Math.sin(m.flapPhase) * 8;
            const midY = drawY + h / 2;

            // SHREDDED MACHO WINGS
            ctx.fillStyle = '#1a2a4a';
            ctx.beginPath();
            ctx.moveTo(cx - 10, midY - 8);
            ctx.lineTo(drawX - 32, midY - 32 + flap);
            ctx.lineTo(drawX - 46, midY + 8 + flap);
            ctx.lineTo(drawX - 20, midY + 14);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#2a4a7a';
            ctx.beginPath();
            ctx.moveTo(cx - 10, midY - 8);
            ctx.lineTo(drawX - 24, midY - 22 + flap);
            ctx.lineTo(drawX - 30, midY + 4 + flap);
            ctx.lineTo(drawX - 14, midY + 8);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#3a6aa0';
            ctx.beginPath();
            ctx.ellipse(drawX - 22, midY - 6 + flap, 8, 10, -0.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1a2a4a';
            ctx.beginPath();
            ctx.moveTo(cx + 10, midY - 8);
            ctx.lineTo(drawX + w + 32, midY - 32 - flap);
            ctx.lineTo(drawX + w + 46, midY + 8 - flap);
            ctx.lineTo(drawX + w + 20, midY + 14);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#2a4a7a';
            ctx.beginPath();
            ctx.moveTo(cx + 10, midY - 8);
            ctx.lineTo(drawX + w + 24, midY - 22 - flap);
            ctx.lineTo(drawX + w + 30, midY + 4 - flap);
            ctx.lineTo(drawX + w + 14, midY + 8);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#3a6aa0';
            ctx.beginPath();
            ctx.ellipse(drawX + w + 22, midY - 6 - flap, 8, 10, 0.4, 0, Math.PI * 2);
            ctx.fill();

            // SHREDDED BODY
            ctx.fillStyle = '#14294a';
            ctx.beginPath();
            ctx.ellipse(cx, midY + 2, w / 2 + 2, h / 2 - 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1e3a5e';
            ctx.beginPath();
            ctx.ellipse(cx, midY, w / 2 - 2, h / 2 - 4, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2a5a9a';
            ctx.beginPath();
            ctx.ellipse(cx, midY - 2, w / 2 - 8, h / 2 - 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // PECS
            ctx.fillStyle = '#4a8ad0';
            ctx.beginPath();
            ctx.ellipse(cx - 10, midY - 8, 12, 10, 0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 10, midY - 8, 12, 10, -0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#6aa8e8';
            ctx.beginPath();
            ctx.ellipse(cx - 10, midY - 10, 7, 5, 0.15, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(cx + 10, midY - 10, 7, 5, -0.15, 0, Math.PI * 2);
            ctx.fill();

            // ABS
            ctx.fillStyle = '#2a5a9a';
            ctx.fillRect(cx - 10, midY + 2, 20, 18);
            ctx.fillStyle = '#4a8ad0';
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 2; col++) {
                    const abX = cx - 8 + col * 9;
                    const abY = midY + 3 + row * 5;
                    ctx.fillRect(abX, abY, 7, 4);
                }
            }
            ctx.fillStyle = '#14294a';
            ctx.fillRect(cx - 1, midY + 2, 2, 18);

            ctx.fillStyle = '#d0e8ff';
            ctx.beginPath();
            ctx.ellipse(cx, midY + 20, 8, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            // SHREDDED ARMS
            ctx.fillStyle = '#1e3a5e';
            ctx.beginPath();
            ctx.ellipse(cx - w / 2 + 2, midY + 6, 10, 15, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2a5a9a';
            ctx.beginPath();
            ctx.ellipse(cx - w / 2 + 2, midY + 4, 7, 11, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#6aa8e8';
            ctx.beginPath();
            ctx.ellipse(cx - w / 2 + 1, midY, 4, 6, 0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1e3a5e';
            ctx.beginPath();
            ctx.ellipse(cx + w / 2 - 2, midY + 6, 10, 15, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2a5a9a';
            ctx.beginPath();
            ctx.ellipse(cx + w / 2 - 2, midY + 4, 7, 11, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#6aa8e8';
            ctx.beginPath();
            ctx.ellipse(cx + w / 2 - 1, midY, 4, 6, -0.3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#f0a030';
            ctx.fillRect(cx - 12, drawY + h - 8, 5, 10);
            ctx.fillRect(cx + 7, drawY + h - 8, 5, 10);
            ctx.fillStyle = '#202020';
            ctx.fillRect(cx - 13, drawY + h - 1, 2, 3);
            ctx.fillRect(cx - 9, drawY + h - 1, 2, 3);
            ctx.fillRect(cx + 6, drawY + h - 1, 2, 3);
            ctx.fillRect(cx + 10, drawY + h - 1, 2, 3);

            // HEAD
            ctx.fillStyle = '#14294a';
            ctx.beginPath();
            ctx.arc(cx, drawY + 12, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#1e3a5e';
            ctx.beginPath();
            ctx.arc(cx, drawY + 11, 13, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2a5a9a';
            ctx.beginPath();
            ctx.arc(cx, drawY + 10, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#0a1a2a';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(cx - 11, drawY + 3);
            ctx.lineTo(cx - 3, drawY + 7);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx + 11, drawY + 3);
            ctx.lineTo(cx + 3, drawY + 7);
            ctx.stroke();

            ctx.strokeStyle = '#0a1a2a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(cx, drawY + 14, 9, 0.2, Math.PI - 0.2);
            ctx.stroke();

            let eyeOffsetX = 0, eyeOffsetY = 0;
            if (m.facing === 'left') eyeOffsetX = -3;
            if (m.facing === 'right') eyeOffsetX = 3;
            if (m.facing === 'up') eyeOffsetY = -2;
            if (m.facing === 'down') eyeOffsetY = 2;

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(cx - 5 + eyeOffsetX, drawY + 9 + eyeOffsetY, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 5 + eyeOffsetX, drawY + 9 + eyeOffsetY, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = '#ffff40';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#202020';
            ctx.beginPath();
            ctx.arc(cx - 5 + eyeOffsetX * 1.5, drawY + 9 + eyeOffsetY, 2.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx + 5 + eyeOffsetX * 1.5, drawY + 9 + eyeOffsetY, 2.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';

            ctx.fillStyle = '#f0a030';
            ctx.beginPath();
            ctx.moveTo(cx - 6, drawY + 14);
            ctx.lineTo(cx + 1, drawY + 28);
            ctx.lineTo(cx + 7, drawY + 14);
            ctx.lineTo(cx, drawY + 18);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#d08020';
            ctx.beginPath();
            ctx.moveTo(cx - 6, drawY + 14);
            ctx.lineTo(cx + 1, drawY + 22);
            ctx.lineTo(cx + 7, drawY + 14);
            ctx.closePath();
            ctx.fill();

            ctx.globalAlpha = 1.0;

            if (m.slamShockwaves) {
                for (const sw of m.slamShockwaves) {
                    const a = Math.max(0, sw.life) * 0.8;
                    ctx.strokeStyle = `rgba(255, 160, 48, ${a})`;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.strokeStyle = `rgba(255, 220, 160, ${a * 0.5})`;
                    ctx.lineWidth = 8;
                    ctx.beginPath();
                    ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            for (const pr of m.projectiles) {
                ctx.save();
                ctx.translate(pr.x, pr.y);
                ctx.rotate(Math.atan2(pr.vy, pr.vx));
                ctx.shadowColor = '#a0d0ff';
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#a0d0ff';
                ctx.beginPath();
                ctx.ellipse(0, 0, 8, 3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(2, 0, 4, 1.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                ctx.shadowBlur = 0;
                ctx.shadowColor = 'transparent';
            }

            const barW = 100, barH = 8;
            const barX = cx - barW / 2;
            const barY = drawY - 36;
            const hpRatio = Math.max(0, m.health / m.maxHealth);

            ctx.fillStyle = '#0a1a0a';
            ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
            ctx.fillStyle = '#2a1a2a';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = hpRatio > 0.5 ? '#40a0d0' : (hpRatio > 0.25 ? '#e0c040' : '#e04040');
            ctx.fillRect(barX, barY, barW * hpRatio, barH);

            ctx.fillStyle = '#ffa030';
            ctx.font = 'bold 9px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('THE BIRD THAT MANONG HATES', cx, barY - 4);
            ctx.textAlign = 'left';
        }

        // ---------- DRAW DROPPED ITEM ----------
        function drawDroppedItem() {
            if (!droppedItem || droppedItem.collected) return;
            const bob = Math.sin(droppedItem.bobPhase) * 4;
            const ix = droppedItem.x;
            const iy = droppedItem.y + bob;

            const g = ctx.createRadialGradient(
                ix + droppedItem.width / 2, iy + droppedItem.height / 2, 4,
                ix + droppedItem.width / 2, iy + droppedItem.height / 2, 40
            );
            g.addColorStop(0, 'rgba(255, 200, 80, 0.9)');
            g.addColorStop(0.5, 'rgba(255, 140, 40, 0.4)');
            g.addColorStop(1, 'rgba(255, 100, 0, 0)');
            ctx.fillStyle = g;
            ctx.fillRect(ix - 30, iy - 30, droppedItem.width + 60, droppedItem.height + 60);

            ctx.save();
            ctx.translate(ix + droppedItem.width / 2, iy + droppedItem.height / 2);
            ctx.rotate(performance.now() / 400);
            ctx.fillStyle = '#ffa030';
            ctx.beginPath();
            ctx.moveTo(0, -16);
            ctx.lineTo(12, 0);
            ctx.lineTo(0, 16);
            ctx.lineTo(-12, 0);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#ffd060';
            ctx.beginPath();
            ctx.moveTo(0, -9);
            ctx.lineTo(6, 0);
            ctx.lineTo(0, 9);
            ctx.lineTo(-6, 0);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            ctx.fillStyle = '#ffff80';
            ctx.font = 'bold 10px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('MACHO ESSENCE', ix + droppedItem.width / 2, iy - 14);
            ctx.textAlign = 'left';
        }

        // ---------- DRAW TERRAIN ----------
        function drawTerrain() {
            const colors = currentArea.groundColors;
            ctx.fillStyle = colors[0];
            ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

            const tileSize = 20;
            for (let i = 0; i < WORLD_WIDTH; i += tileSize) {
                for (let j = 0; j < WORLD_HEIGHT; j += tileSize) {
                    if ((Math.floor(i / tileSize) + Math.floor(j / tileSize)) % 2 === 0) {
                        ctx.fillStyle = colors[1];
                        ctx.fillRect(i, j, tileSize, tileSize);
                    } else {
                        ctx.fillStyle = colors[2];
                        ctx.fillRect(i, j, tileSize, tileSize);
                    }
                }
            }

            for (let k = 0; k < 180; k++) {
                const x = (Math.sin(k * 12.9898) * 43758.5453) % WORLD_WIDTH;
                const y = (Math.cos(k * 78.233) * 43758.5453) % WORLD_HEIGHT;
                const absX = Math.floor(Math.abs(x));
                const absY = Math.floor(Math.abs(y));
                ctx.fillStyle = currentArea.accentColor;
                ctx.fillRect(absX, absY, 3, 3);
                if (k % 3 === 0) {
                    ctx.fillStyle = currentArea.flowerColor;
                    ctx.fillRect(absX + 2, absY - 2, 2, 2);
                }
                if (k % 7 === 0) {
                    ctx.fillStyle = currentArea.flowerColor;
                    ctx.fillRect(absX + 4, absY + 2, 2, 2);
                }
            }

            for (let p = 0; p < 40; p++) {
                const px = (Math.sin(p * 31.7) * 10000) % WORLD_WIDTH;
                const py = (Math.cos(p * 17.3) * 10000) % WORLD_HEIGHT;
                ctx.fillStyle = colors[2];
                ctx.globalAlpha = 0.2;
                ctx.fillRect(Math.abs(px), Math.abs(py), 12, 12);
                ctx.globalAlpha = 1.0;
            }

            ctx.fillStyle = currentArea.rockColor;
            for (let s = 0; s < 8; s++) {
                const sx = (Math.sin(s * 44.1) * 5000) % WORLD_WIDTH;
                const sy = (Math.cos(s * 88.2) * 5000) % WORLD_HEIGHT;
                ctx.fillRect(Math.abs(sx), Math.abs(sy), 6, 4);
            }
        }

        // ---------- DRAW PORTALS ----------
        function drawPortals() {
            const time = performance.now() / 1000;
            for (const p of currentArea.portals) {
                const cx = p.x + p.w / 2;
                const cy = p.y + p.h / 2;

                ctx.save();
                ctx.translate(cx, cy);

                const pulse = 1 + Math.sin(time * 3) * 0.1;
                const grad = ctx.createRadialGradient(0, 0, 4, 0, 0, p.w * 0.7 * pulse);
                grad.addColorStop(0, 'rgba(160, 200, 255, 0.9)');
                grad.addColorStop(0.5, 'rgba(100, 120, 255, 0.6)');
                grad.addColorStop(1, 'rgba(40, 40, 120, 0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, p.w * 0.7 * pulse, 0, Math.PI * 2);
                ctx.fill();

                ctx.rotate(time * 2);
                ctx.strokeStyle = `rgba(200, 230, 255, ${0.5 + Math.sin(time * 5) * 0.2})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, p.w * 0.35, 0, Math.PI * 1.5);
                ctx.stroke();

                ctx.rotate(-time * 3);
                ctx.strokeStyle = `rgba(180, 200, 255, ${0.4 + Math.sin(time * 4) * 0.2})`;
                ctx.beginPath();
                ctx.arc(0, 0, p.w * 0.25, Math.PI, Math.PI * 2.5);
                ctx.stroke();

                ctx.restore();

                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(cx - 30, p.y - 18, 60, 16);
                ctx.fillStyle = '#c0e0ff';
                ctx.font = 'bold 10px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(p.label, cx, p.y - 6);
                ctx.textAlign = 'left';
            }
        }

        // ---------- DRAW CORRIDORS ----------
        function drawCorridors() {
            const time = performance.now() / 1000;
            for (const c of currentArea.corridors) {
                const cx = c.x + c.w / 2;
                const cy = c.y + c.h / 2;

                ctx.fillStyle = '#1a1a2a';
                ctx.fillRect(c.x, c.y, c.w, c.h);
                ctx.fillStyle = '#3a3a4a';
                ctx.fillRect(c.x - 4, c.y, 4, c.h);
                ctx.fillRect(c.x + c.w, c.y, 4, c.h);
                ctx.fillStyle = '#5a5a6a';
                ctx.beginPath();
                ctx.arc(cx, c.y, c.w / 2, Math.PI, 0);
                ctx.fill();

                for (let i = 0; i < 4; i++) {
                    const ry = c.y + 10 + i * (c.h - 20) / 3;
                    const glow = 0.5 + Math.sin(time * 3 + i) * 0.3;
                    ctx.fillStyle = `rgba(160, 220, 255, ${glow})`;
                    ctx.fillRect(c.x + 6, ry, 4, 4);
                    ctx.fillRect(c.x + c.w - 10, ry, 4, 4);
                }

                ctx.fillStyle = 'rgba(192, 224, 255, 0.7)';
                ctx.beginPath();
                ctx.moveTo(cx - 6, cy - 6);
                ctx.lineTo(cx + 6, cy - 6);
                ctx.lineTo(cx, cy + 2);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(cx - 44, c.y - 20, 88, 16);
                ctx.fillStyle = '#c0e0ff';
                ctx.font = 'bold 10px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(c.label, cx, c.y - 8);
                ctx.textAlign = 'left';
            }
        }

        // ---------- DRAW SHOP ----------
        function drawShop() {
            if (currentAreaKey !== 'MEADOW') return;

            const x = SHOP.x, y = SHOP.y, w = SHOP.width, h = SHOP.height;

            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.beginPath();
            ctx.ellipse(x + w / 2, y + h - 2, w / 2 + 4, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#8a6a4a';
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = '#6a4a2a';
            ctx.fillRect(x, y + h - 12, w, 12);
            ctx.fillStyle = '#9a7a5a';
            ctx.fillRect(x, y, w, 10);

            ctx.strokeStyle = '#5a3a1a';
            ctx.lineWidth = 2;
            for (let i = 0; i < w; i += 20) {
                ctx.beginPath();
                ctx.moveTo(x + i, y + 10);
                ctx.lineTo(x + i, y + h);
                ctx.stroke();
            }

            ctx.fillStyle = '#6a2a2a';
            ctx.beginPath();
            ctx.moveTo(x - 8, y);
            ctx.lineTo(x + w / 2, y - 30);
            ctx.lineTo(x + w + 8, y);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#8a3a3a';
            ctx.beginPath();
            ctx.moveTo(x - 8, y);
            ctx.lineTo(x + w / 2, y - 30);
            ctx.lineTo(x + w / 2, y - 20);
            ctx.lineTo(x - 2, y);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#4a1a1a';
            ctx.fillRect(x + w / 2 - 3, y - 32, 6, 6);

            const doorW = 30, doorH = 40;
            const doorX = x + w / 2 - doorW / 2;
            const doorY = y + h - doorH;
            ctx.fillStyle = '#3a2a1a';
            ctx.fillRect(doorX, doorY, doorW, doorH);
            ctx.fillStyle = '#5a3a1a';
            ctx.fillRect(doorX + 3, doorY + 3, doorW - 6, doorH - 6);
            ctx.fillStyle = '#d4af37';
            ctx.beginPath();
            ctx.arc(doorX + doorW - 8, doorY + doorH / 2, 3, 0, Math.PI * 2);
            ctx.fill();
