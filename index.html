            ctx.fillStyle = '#2a1a0a';
            ctx.fillRect(x + 10, y + 18, 20, 16);
            ctx.fillRect(x + w - 30, y + 18, 20, 16);
            ctx.fillStyle = '#a0d0f0';
            ctx.fillRect(x + 12, y + 20, 16, 12);
            ctx.fillRect(x + w - 28, y + 20, 16, 12);
            ctx.fillStyle = '#2a1a0a';
            ctx.fillRect(x + 19, y + 20, 2, 12);
            ctx.fillRect(x + 12, y + 25, 16, 2);
            ctx.fillRect(x + w - 21, y + 20, 2, 12);
            ctx.fillRect(x + w - 28, y + 25, 16, 2);

            ctx.fillStyle = '#3a2a1a';
            ctx.fillRect(x + w / 2 - 28, y + 6, 56, 18);
            ctx.fillStyle = '#d4af37';
            ctx.font = 'bold 12px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('SHOP', x + w / 2, y + 20);
            ctx.textAlign = 'left';

            const px = player.x + PLAYER_SIZE / 2;
            const py = player.y + PLAYER_SIZE / 2;
            if (px > SHOP_DOOR.x && px < SHOP_DOOR.x + SHOP_DOOR.width &&
                py > SHOP_DOOR.y && py < SHOP_DOOR.y + SHOP_DOOR.height &&
                gameState === STATE.OUTSIDE) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(x + w / 2 - 50, y - 50, 100, 24);
                ctx.fillStyle = '#ffff80';
                ctx.font = 'bold 14px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('Press E to enter', x + w / 2, y - 33);
                ctx.textAlign = 'left';
            }
        }

        // ---------- DRAW INTERIOR ----------
        function drawInterior() {
            ctx.fillStyle = '#7a5a3a';
            ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
            ctx.strokeStyle = '#5a3a1a';
            ctx.lineWidth = 2;
            for (let i = 0; i < WORLD_HEIGHT; i += 30) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(WORLD_WIDTH, i);
                ctx.stroke();
            }
            for (let i = 0; i < WORLD_WIDTH; i += 60) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, WORLD_HEIGHT);
                ctx.stroke();
            }

            ctx.fillStyle = '#5a3a2a';
            ctx.fillRect(0, 0, WORLD_WIDTH, 40);
            ctx.fillRect(0, 0, 40, WORLD_HEIGHT);
            ctx.fillRect(WORLD_WIDTH - 40, 0, 40, WORLD_HEIGHT);
            ctx.fillRect(0, WORLD_HEIGHT - 40, WORLD_WIDTH, 40);

            ctx.fillStyle = '#6a4a3a';
            for (let i = 40; i < WORLD_WIDTH - 40; i += 30) {
                ctx.fillRect(i, 0, 2, 40);
            }

            ctx.fillStyle = '#3a2a1a';
            ctx.fillRect(WORLD_WIDTH / 2 - 30, WORLD_HEIGHT - 40, 60, 40);
            ctx.fillStyle = '#5a3a1a';
            ctx.fillRect(WORLD_WIDTH / 2 - 26, WORLD_HEIGHT - 36, 52, 36);
            ctx.fillStyle = '#d4af37';
            ctx.beginPath();
            ctx.arc(WORLD_WIDTH / 2 + 20, WORLD_HEIGHT - 20, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffff80';
            ctx.font = 'bold 12px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('EXIT', WORLD_WIDTH / 2, WORLD_HEIGHT - 44);
            ctx.textAlign = 'left';

            drawShopkeeper();

            if (shopMenuOpen) {
                drawShopMenu();
            }

            if (shopMessageTimer > 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(WORLD_WIDTH / 2 - 160, WORLD_HEIGHT - 100, 320, 32);
                ctx.fillStyle = '#ffff80';
                ctx.font = 'bold 16px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(shopMessage, WORLD_WIDTH / 2, WORLD_HEIGHT - 78);
                ctx.textAlign = 'left';
            }
        }

        // ---------- DRAW SHOPKEEPER ----------
        function drawShopkeeper() {
            const x = SHOPKEEPER.x, y = SHOPKEEPER.y;

            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(x + 20, y + 48, 16, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#4a3a6a';
            ctx.fillRect(x + 6, y + 20, 28, 26);
            ctx.fillStyle = '#5a4a7a';
            ctx.fillRect(x + 8, y + 22, 24, 22);
            ctx.fillStyle = '#d4af37';
            ctx.fillRect(x + 6, y + 40, 28, 4);
            ctx.fillRect(x + 18, y + 20, 4, 26);

            ctx.fillStyle = '#4a3a6a';
            ctx.fillRect(x + 0, y + 24, 8, 14);
            ctx.fillRect(x + 32, y + 24, 8, 14);
            ctx.fillStyle = '#e0b080';
            ctx.fillRect(x + 1, y + 34, 6, 6);
            ctx.fillRect(x + 33, y + 34, 6, 6);

            ctx.fillStyle = '#e0b080';
            ctx.fillRect(x + 10, y + 4, 20, 18);
            ctx.fillStyle = '#3a2a1a';
            ctx.fillRect(x + 8, y, 24, 8);
            ctx.fillRect(x + 6, y + 4, 4, 10);
            ctx.fillRect(x + 30, y + 4, 4, 10);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x + 13, y + 10, 5, 5);
            ctx.fillRect(x + 22, y + 10, 5, 5);
            ctx.fillStyle = '#101010';
            ctx.fillRect(x + 15, y + 12, 2, 3);
            ctx.fillRect(x + 24, y + 12, 2, 3);
            ctx.fillStyle = '#8a5a3a';
            ctx.fillRect(x + 16, y + 17, 8, 2);

            ctx.fillStyle = '#2a1a3a';
            ctx.fillRect(x + 8, y - 6, 24, 8);
            ctx.fillStyle = '#3a2a4a';
            ctx.fillRect(x + 12, y - 12, 16, 8);
            ctx.fillStyle = '#d4af37';
            ctx.fillRect(x + 8, y - 1, 24, 2);

            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(x - 8, y - 24, 56, 16);
            ctx.fillStyle = '#ffff80';
            ctx.font = 'bold 11px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('SHOPKEEPER', x + 20, y - 12);
            ctx.textAlign = 'left';
        }

        // ---------- DRAW SHOP MENU ----------
        function drawShopMenu() {
            const mx = WORLD_WIDTH / 2 - 200;
            const my = 60;
            const mw = 400;
            const mh = 160;

            ctx.fillStyle = 'rgba(20, 15, 30, 0.92)';
            ctx.fillRect(mx, my, mw, mh);
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 3;
            ctx.strokeRect(mx, my, mw, mh);

            ctx.fillStyle = '#d4af37';
            ctx.font = 'bold 22px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('~ SHOP ~', mx + mw / 2, my + 34);

            ctx.font = 'bold 14px "Courier New", monospace';
            ctx.fillStyle = '#e0e0ff';
            ctx.fillText('Gold: ' + player.gold, mx + mw / 2, my + 58);

            ctx.strokeStyle = '#4a3a5a';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(mx + 20, my + 70);
            ctx.lineTo(mx + mw - 20, my + 70);
            ctx.stroke();

            ctx.textAlign = 'left';
            ctx.fillStyle = '#a0a0c0';
            ctx.font = '15px "Courier New", monospace';
            ctx.fillText('Nothing for sale right now...', mx + 30, my + 105);

            ctx.fillStyle = '#ffff80';
            ctx.font = 'bold 13px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('E to exit', mx + mw / 2, my + mh - 18);
            ctx.textAlign = 'left';
        }

        // ---------- UPDATE PLAYER ----------
        function updatePlayer(deltaTime) {
            if (player.hurtTimer > 0) player.hurtTimer -= deltaTime * 1000;
            if (player.dodgeCooldown > 0) player.dodgeCooldown -= deltaTime;
            if (player.dodgeInvuln) {
                player.dodgeInvuln = false;
                if (player.isDodging) player.dodgeInvuln = true;
            }

            if (player.isDodging) {
                player.dodgeTimer -= deltaTime;
                const step = DODGE_SPEED * (deltaTime * 60) * 0.7;
                const nx = player.x + player.dodgeDirX * step;
                const ny = player.y + player.dodgeDirY * step;

                let minX = MIN_X, maxX = MAX_X, minY = MIN_Y, maxY = MAX_Y;
                if (gameState === STATE.INSIDE) {
                    minX = 45; maxX = WORLD_WIDTH - 45 - PLAYER_SIZE;
                    minY = 45; maxY = WORLD_HEIGHT - 45 - PLAYER_SIZE;
                }
                player.x = Math.max(minX, Math.min(maxX, nx));
                player.y = Math.max(minY, Math.min(maxY, ny));
                player.dodgeInvuln = true;

                if (player.dodgeTimer <= 0) {
                    player.isDodging = false;
                }
                return;
            }

            let dx = 0;
            let dy = 0;
            if (keys.KeyA) dx -= player.speed;
            if (keys.KeyD) dx += player.speed;
            if (keys.KeyW) dy -= player.speed;
            if (keys.KeyS) dy += player.speed;

            player.isMoving = (dx !== 0 || dy !== 0);
            if (player.isMoving) {
                player.walkPhase += deltaTime * 12;
                if (dx < 0) player.facing = 'left';
                else if (dx > 0) player.facing = 'right';
                else if (dy < 0) player.facing = 'up';
                else if (dy > 0) player.facing = 'down';
            }

            let minX = MIN_X, maxX = MAX_X, minY = MIN_Y, maxY = MAX_Y;
            if (gameState === STATE.INSIDE) {
                minX = 45; maxX = WORLD_WIDTH - 45 - PLAYER_SIZE;
                minY = 45; maxY = WORLD_HEIGHT - 45 - PLAYER_SIZE;
            }

            let newX = player.x + dx;
            if (newX < minX) newX = minX;
            if (newX > maxX) newX = maxX;
            player.x = newX;

            let newY = player.y + dy;
            if (newY < minY) newY = minY;
            if (newY > maxY) newY = maxY;
            player.y = newY;
        }

        // ---------- UPDATE TIMERS ----------
        function updateTimers(deltaTime) {
            if (attackTimer > 0) {
                attackTimer -= deltaTime * 1000;
                if (attackTimer < 0) attackTimer = 0;
            }
            if (attackCooldownTimer > 0) {
                attackCooldownTimer -= deltaTime * 1000;
                if (attackCooldownTimer < 0) attackCooldownTimer = 0;
            }
            if (portalCooldown > 0) {
                portalCooldown -= deltaTime;
            }
            if (shopMessageTimer > 0) {
                shopMessageTimer -= deltaTime * 1000;
                if (shopMessageTimer < 0) shopMessageTimer = 0;
            }
        }

        // ---------- UPDATE PARTICLES ----------
        function updateParticles(deltaTime) {
            for (let i = slashParticles.length - 1; i >= 0; i--) {
                const p = slashParticles[i];
                p.x += p.vx * deltaTime * 60;
                p.y += p.vy * deltaTime * 60;
                p.life -= deltaTime * 2.2;
                p.vx *= 0.96;
                p.vy *= 0.96;
                if (p.life <= 0) slashParticles.splice(i, 1);
            }
            for (let i = hitParticles.length - 1; i >= 0; i--) {
                const p = hitParticles[i];
                p.x += p.vx * deltaTime * 60;
                p.y += p.vy * deltaTime * 60;
                p.vy += deltaTime * 4;
                p.life -= deltaTime * 1.8;
                if (p.life <= 0) hitParticles.splice(i, 1);
            }
            for (let i = damageNumbers.length - 1; i >= 0; i--) {
                const d = damageNumbers[i];
                d.y += d.vy * deltaTime * 60;
                d.life -= deltaTime * 1.2;
                if (d.life <= 0) damageNumbers.splice(i, 1);
            }
        }

        // ---------- DRAW PARTICLES ----------
        function drawParticles() {
            for (const p of slashParticles) {
                ctx.globalAlpha = p.life * 0.9;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                ctx.fillStyle = '#c0ffc0';
                ctx.fillRect(p.x - p.size / 4, p.y - p.size / 4, p.size / 2, p.size / 2);
            }
            for (const p of hitParticles) {
                ctx.globalAlpha = p.life * 0.9;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            for (const d of damageNumbers) {
                ctx.globalAlpha = d.life;
                ctx.fillStyle = d.color;
                ctx.font = 'bold 16px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(d.text, d.x, d.y);
            }
            ctx.globalAlpha = 1.0;
            ctx.textAlign = 'left';
        }

        // ---------- DRAW HUD ----------
        function drawHUD() {
            const barW = 180, barH = 18, barX = 16, barY = 16;
            const hpRatio = Math.max(0, player.health / player.maxHealth);

            ctx.fillStyle = '#0a1a0a';
            ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
            ctx.fillStyle = '#1a2a1a';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = player.isMacho ? '#ffa030' : (hpRatio > 0.5 ? '#40c040' : (hpRatio > 0.25 ? '#e0c040' : '#e04040'));
            ctx.fillRect(barX, barY, barW * hpRatio, barH);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 12px "Courier New", monospace';
            ctx.textAlign = 'left';
            ctx.fillText('HP', barX + 4, barY + 14);
            ctx.fillText(Math.ceil(player.health) + ' / ' + player.maxHealth, barX + 40, barY + 14);

            ctx.fillStyle = '#d4af37';
            ctx.font = 'bold 14px "Courier New", monospace';
            ctx.fillText('Gold: ' + player.gold, barX, barY + 52);

            const dodgeReady = player.dodgeCooldown <= 0;
            ctx.fillStyle = dodgeReady ? '#c0ffe0' : '#5a6a5a';
            ctx.font = 'bold 12px "Courier New", monospace';
            ctx.fillText(dodgeReady ? 'DODGE READY [SHIFT]' : 'DODGE...', barX, barY + 72);
            if (!dodgeReady) {
                ctx.fillStyle = '#2a3a2a';
                ctx.fillRect(barX, barY + 78, 90, 5);
                ctx.fillStyle = '#40a060';
                ctx.fillRect(barX, barY + 78, 90 * (1 - player.dodgeCooldown / DODGE_COOLDOWN), 5);
            }

            if (player.isMacho) {
                ctx.fillStyle = '#ffa030';
                ctx.font = 'bold 13px "Courier New", monospace';
                ctx.fillText('★ MACHO MODE ★', barX, barY + 100);
            }

            ctx.fillStyle = '#c0e0ff';
            ctx.font = 'bold 14px "Courier New", monospace';
            ctx.textAlign = 'right';
            ctx.fillText(currentArea.name, WORLD_WIDTH - 16, barY + 14);
            ctx.textAlign = 'left';

            let totalHp = 0, totalMax = 0;
            for (const m of monsters) {
                if (m.alive) {
                    totalHp += m.health;
                    totalMax += m.maxHealth;
                }
            }
            if (totalMax > 0 && gameState === STATE.OUTSIDE) {
                ctx.fillStyle = '#2a1a2a';
                ctx.fillRect(barX, barY + 118, barW, 18);
                ctx.fillStyle = '#a040ff';
                ctx.fillRect(barX, barY + 118, barW * (totalHp / totalMax), 18);
                ctx.fillStyle = '#ffffff';
                ctx.fillText('SHADOWS', barX + 6, barY + 132);
            } else if (totalMax === 0 && gameState === STATE.OUTSIDE) {
                ctx.fillStyle = '#40ff40';
                ctx.font = 'bold 16px "Courier New", monospace';
                ctx.fillText('AREA CLEARED!', barX, barY + 134);
            }

            if (player.health <= 0) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
                ctx.fillStyle = '#ff4040';
                ctx.font = 'bold 40px "Courier New", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', WORLD_WIDTH / 2, WORLD_HEIGHT / 2 - 20);
                ctx.fillStyle = '#e0e0e0';
                ctx.font = 'bold 20px "Courier New", monospace';
                ctx.fillText('refresh to restart', WORLD_WIDTH / 2, WORLD_HEIGHT / 2 + 30);
                ctx.textAlign = 'left';
            }
        }

        // ---------- GAME LOOP ----------
        let lastTimestamp = 0;

        function gameLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            let deltaTime = (timestamp - lastTimestamp) / 1000;
            if (deltaTime > 0.1) deltaTime = 0.1;
            lastTimestamp = timestamp;

            if (player.health > 0) {
                updatePlayer(deltaTime);
                if (gameState === STATE.OUTSIDE) {
                    updateMonsters(deltaTime);
                    checkSwordHit();
                }
            }
            updateTimers(deltaTime);
            updateParticles(deltaTime);

            if (gameState === STATE.OUTSIDE) {
                drawTerrain();
                drawPortals();
                drawCorridors();
                drawShop();
                for (const m of monsters) drawMonster(m);
                drawDroppedItem();
                drawPlayer(player.x, player.y);
                drawSword();
                drawParticles();
            } else {
                drawInterior();
                drawPlayer(player.x, player.y);
                drawParticles();
            }
            drawHUD();

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    })();
</script>
